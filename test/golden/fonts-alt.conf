<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Tipografía ALTERNATIVA para simular una plataforma con otras fuentes (macOS): todo sale en DejaVu Serif (fonts-dejavu-core).
     Solo la usa test/golden.mjs para comprobar que el modo tolerante acepta otra tipografía y sigue detectando cambios de composición. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir>/tmp/opus-golden-fontconfig-alt</cachedir>
  <selectfont>
    <rejectfont><glob>*</glob></rejectfont>
    <acceptfont><glob>*/DejaVuSerif.ttf</glob><glob>*/DejaVuSerif-Bold.ttf</glob></acceptfont>
  </selectfont>
  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>DejaVu Sans</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>DejaVu Sans Mono</family><prefer><family>DejaVu Serif</family></prefer></alias>
</fontconfig>
